server:
  servlet:
    context-path: /${REPO_NAME}
spring:
  config:
    import:
      - optional:file:.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVICE_URL:auth-service}
          jwk-set-uri: ${AUTH_SERVICE_URL:auth-service}/oauth2/jwks
  mvc:
    cors:
      mappings:
        "[/**]":
          allowed-origins:
            - "http://localhost:3000"
            - "https://fancia.co.uk"
            - "https://www.fancia.co.uk"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          allowed-headers:
            - Authorization
            - Content-Type
            - Accept
          exposed-headers:
            - Authorization
            - Content-Type
          allow-credentials: true
          max-age: 3600
  datasource:
    url: ${DATABASE_URL}
    username: ${AWS_RDS_SECRET_NAME:${DATABASE_USERNAME}}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER:com.amazonaws.secretsmanager.sql.AWSSecretsManagerPostgreSQLDriver}
    hikari:
      allow-pool-suspension: true
      maximum-pool-size: "${MAX_POOL_SIZE:2}"
      minimum-idle: "${MIN_IDLE:0}"
      connection-timeout: 5000
      validation-timeout: 1000
      idle-timeout: 60000
      max-lifetime: 180000
      keepalive-time: 0
      initialization-fail-timeout: "-1"
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  cloud:
    aws:
      secretsmanager:
        endpoint: http://localhost:4566
        region: ${AWS_REGION}
      credentials:
        access-key: test
        secret-key: test
    kubernetes:
      discovery:
        enabled: ${KUBERNETES_ENABLED:true}
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      client:
        config:
          auth-service:
            url: ${AUTH_SERVICE_URL:#{null}}
          auth-internal-service:
            url: ${AUTH_INTERNAL_SERVICE_URL:#{null}}
          user-service:
            url: ${USER_SERVICE_URL:#{null}}
          user-internal-service:
            url: ${USER_INTERNAL_SERVICE_URL:#{null}}
          venue-service:
            url: ${VENUE_SERVICE_URL:#{null}}
          venue-internal-service:
            url: ${VENUE_INTERNAL_SERVICE_URL:#{null}}
          event-service:
            url: ${EVENT_SERVICE_URL:#{null}}
          event-internal-service:
            url: ${EVENT_INTERNAL_SERVICE_URL:#{null}}

  flyway:
    locations: classpath:db/migration
    placeholders:
      gis_admin_password: ${GIS_ADMIN_PASSWORD}
app:
  application-name: ${PROJECT_NAME}-backend-${REPO_NAME}
  base-url: ${DOMAIN_NAME}/${REPO_NAME}/api
  login-page-url: ${AUTH_SERVICE_URL:auth-service}/login
  allowed-origins:
    - "http://localhost:3000"
    - "https://fancia.co.uk"
    - "https://www.fancia.co.uk"

  firebase:
    enabled: false
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: DEBUG
    com.fancia.backend.notification: DEBUG
